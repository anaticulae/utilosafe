[project]
name = "utilosafe"
version = "1.0.0"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "bcrypt>=5.0.0,<6.0.0",
    "configos>=1.0.4,<3.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "utilo>=2.112.3,<3.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.scripts]
safeme_create = "utilosafe.cli:main"

[project.optional-dependencies]
dev = [
    "utilotest>=1.1.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/utilosafe"
Repository = "https://github.com/anaticulae/utilosafe"

[build-system]
requires = [
    "setuptools>=82.0.1",
    "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
default_bump_level = 2

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "utilosafe",
]
exclude = [
    "tests*",
]
